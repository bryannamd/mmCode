<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단위 보드</title>
<style>
:root {
  --bg: #fffdf4; --text: #232845; --sub: #4d5677; --line: #d9d6c4; --surface: #fffdf4;
  --btn-bg: #232845; --btn-text: #fffdf4; --focus: #232845;
  --pink: #ff4f9a; --on-pink: #232845; --green: #3fc46f;
  --font: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141833; --text: #fffdf4; --sub: #c9d3ee; --line: #2f3b76; --surface: #253066;
    --btn-bg: #fffdf4; --btn-text: #232845; --focus: #fffdf4;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
h1 { font-size: 17px; margin: 0 0 12px; }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 13px; margin: 0 0 8px; color: var(--sub); }
code { font-family: ui-monospace, monospace; font-size: 13px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 40px; padding: 0 16px;
  border: 0; border-radius: 8px; background: var(--btn-bg); color: var(--btn-text); font: inherit; cursor: pointer; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.btn:focus-visible, .pick:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.note { color: var(--sub); margin: 0 0 12px; }
.alert { background: var(--pink); color: var(--on-pink); border-radius: 8px; padding: 12px; margin-bottom: 12px; font-weight: 600; }
.opencount { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
.decision { overflow-wrap: anywhere; border: 3px solid var(--pink); border-radius: 8px; background: var(--surface); padding: 12px; margin-bottom: 12px; }
.decision h2 { display: inline-block; background: var(--pink); color: var(--on-pink); font-size: 18px; border-radius: 3px; padding: 2px 8px; }
.decision p { margin: 0 0 6px; }
.where { color: var(--sub); }
.question { font-size: 16px; font-weight: 700; }
.option { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
.tag { margin-left: 8px; border: 1px solid var(--text); border-radius: 3px; padding: 0 6px; font-size: 12px; }
.optrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.optrow .opt { flex: 1 1 160px; min-width: 0; margin: 0; }
.cmddet summary { min-height: 40px; display: flex; align-items: center; cursor: pointer; color: var(--sub); }
.cmddet summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
summary::before { content: '▸'; margin-right: 6px; }
details[open] > summary::before { content: '▾'; }
.cmd { min-width: 0; margin: 0; padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.copied { color: var(--sub); }
.answered { overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; margin-bottom: 16px; }
.answered summary { min-height: 40px; display: flex; align-items: center; cursor: pointer; }
.answered summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.adec { border-top: 1px solid var(--line); padding: 8px 0; overflow-wrap: anywhere; }
.adec p { margin: 0 0 4px; }
.error { border: 2px solid var(--pink); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
.error p { margin: 0 0 6px; }
.plan { margin-bottom: 24px; }
.cols { display: grid; grid-template-columns: 1fr; gap: 8px; }
.col { border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0; }
.col.empty { padding-bottom: 0; }
.col.empty h3 { margin-bottom: 8px; }
.unit { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px; margin-bottom: 8px; overflow-wrap: anywhere; }
.unit.done { border-left: 4px solid var(--green); }
.unit.halted { border-left: 4px solid var(--pink); }
.name { font-weight: 700; }
.halt { flex-basis: 100%; background: var(--pink); color: var(--on-pink); border-radius: 3px; padding: 2px 6px; font-weight: 600; }
@media (min-width: 720px) {
  .cols { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .col.empty { padding-bottom: 8px; }
}
</style>
</head>
<body>
<h1>단위 보드</h1>
<div class="bar">
  <button class="btn" id="reload" type="button">다시 읽기</button>
  <label class="btn pick">파일 고르기<input id="file" type="file" accept=".jsonl,.json,.txt"></label>
</div>
<div id="decisions" hidden></div>
<div id="alert" class="alert" role="status" hidden></div>
<p id="source" class="note"></p>
<div id="error" class="error" role="alert" hidden></div>
<div id="out" aria-live="polite"></div>
<div id="answered" hidden></div>
<script src="board.js"></script>
<script>
(function () {
  var URL_EVENTS = '../.mmcode/events.jsonl';
  var out = document.getElementById('out');
  var err = document.getElementById('error');
  var decEl = document.getElementById('decisions');
  var answeredEl = document.getElementById('answered');
  var alertEl = document.getElementById('alert');
  var source = document.getElementById('source');

  function hhmm() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function show(text, where) {
    err.hidden = true;
    var p = board.parse(text);
    var r = board.reduce(p.events);
    var s = board.summarize(r.halted);
    alertEl.textContent = s;
    alertEl.hidden = !s;
    source.textContent = '읽은 곳: ' + where + ' · ' + hhmm();
    board.render(out, r, p.skipped);
    board.renderDecisions(decEl, answeredEl, r.decisions);
  }

  function fail(reason) {
    out.textContent = '';
    decEl.hidden = true;
    answeredEl.hidden = true;
    alertEl.hidden = true;
    source.textContent = '';
    err.hidden = false;
    err.textContent = '';
    var a = document.createElement('p');
    a.textContent = '이벤트 파일을 읽지 못했다. 이유: ' + reason;
    var b = document.createElement('p');
    b.textContent = '할 일: 저장소 최상위에서 python3 -m http.server 를 실행하고 /board/ 를 연다. 또는 위의 "파일 고르기"로 .mmcode/events.jsonl 을 고른다.';
    err.appendChild(a);
    err.appendChild(b);
  }

  function load() {
    fetch(URL_EVENTS, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (t) { show(t, '서버의 .mmcode/events.jsonl'); })
      .catch(function (e) { fail(e.message || String(e)); });
  }

  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('file').addEventListener('change', function (ev) {
    var f = ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { show(String(rd.result), '고른 파일 ' + f.name); };
    rd.onerror = function () { fail('파일을 읽을 수 없다'); };
    rd.readAsText(f);
  });
  load();
})();
</script>
</body>
</html>
